server {
    listen 80;
    server_name localhost;

    # Carpeta pública del proyecto (en Laravel será /var/www/html/public)
    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 50M;

    location / {
        # Si el archivo no existe, pasa todo a index.php (front controller)
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pasa los .php al contenedor PHP-FPM (servicio "php" del compose)
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # No servir archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
